<!doctype html>
<meta charset="utf-8">
<title>BubbasDoku smoke test</title>
<iframe id="f" src="../index.html" style="width:390px;height:844px;border:0"></iframe>
<p>Run in a fresh browser profile (first-visit state).</p>
<pre id="out">running</pre>
<script>
const out = [];
const ok = (cond, msg) => out.push((cond ? 'PASS ' : 'FAIL ') + msg);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById('f').onload = async () => {
  try {
    const W = document.getElementById('f').contentWindow, D = W.document;
    await wait(200);
    ok(D.querySelector('#help').open, 'help dialog shown on first visit');
    D.querySelector('#help [data-close]').click();
    const cells = () => [...D.querySelectorAll('.cell')];
    const st = (i) => cells()[i].dataset.state;
    const ptr = (type, el, id = 1) => {
      const r = el.getBoundingClientRect();
      D.querySelector('#board').dispatchEvent(new W.PointerEvent(type, { bubbles: true, pointerId: id, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
    };
    const tap = (i) => { ptr('pointerdown', cells()[i]); ptr('pointerup', cells()[i]); };
    const n = Math.sqrt(cells().length);
    ok(n === 7, 'daily board is 7x7 (got ' + n + ')');
    tap(0); ok(st(0) === '1', 'tap -> mark');
    tap(0); ok(st(0) === '2', 'tap -> boxer');
    tap(1); tap(1);
    ok(cells()[0].classList.contains('wrong') || cells()[1].classList.contains('wrong'), 'adjacent boxers: at least one flagged wrong');
    D.querySelector('#undo').click(); ok(st(1) === '1', 'undo');
    D.querySelector('#clear').click(); ok(cells().every((c) => c.dataset.state === '0'), 'clear');
    // wrong placement feedback: hint places a correct boxer; another cell in its row must be wrong
    D.querySelector('#hint').click();
    const good = cells().findIndex((c) => c.dataset.state === '2');
    ok(good >= 0 && !cells()[good].classList.contains('wrong'), 'correct boxer not flagged');
    ok(D.querySelectorAll('.cell.auto').length > 0, 'auto-marks shown around correct boxer');
    D.querySelector('#automark').click();
    ok(D.querySelectorAll('.cell.auto').length === 0, 'auto-marks toggle off');
    D.querySelector('#automark').click();
    const bad = Math.floor(good / n) * n + ((good % n) + 3) % n;
    tap(bad); tap(bad);
    ok(cells()[bad].classList.contains('wrong'), 'wrong boxer flagged');
    ok(cells()[bad].classList.contains('oops'), 'wrong boxer shakes');
    ok(D.querySelector('#toast').textContent === 'Not there!' && D.querySelector('#toast').classList.contains('show'), 'wrong boxer toast');
    await wait(900);
    ok(st(bad) === '1' && !cells()[bad].classList.contains('wrong'), 'wrong boxer fades into a mark');
    D.querySelector('#undo').click();
    ok(st(bad) === '1', 'undo goes back to before the wrong tap (mark)');
    D.querySelector('#undo').click();
    ok(st(bad)[0] === '0', 'undo again -> empty');
    // tapping the wrong boxer again mid-animation just settles it into a mark
    tap(bad); tap(bad); tap(bad);
    ok(st(bad) === '1', 'tap during animation settles to mark (no re-cycle)');
    // switching away mid-animation doesn't leave a wrong boxer saved
    D.querySelector('#clear').click();
    // drag paint
    ptr('pointerdown', cells()[n]); ptr('pointermove', cells()[n + 1]); ptr('pointermove', cells()[n + 2]); ptr('pointerup', cells()[n + 2]);
    ok(st(n) === '1' && st(n + 1) === '1' && st(n + 2) === '1', 'drag paints marks');
    D.querySelector('#clear').click();
    for (let k = 0; k < n; k++) D.querySelector('#hint').click();
    await wait(1500);
    ok(D.querySelector('#board').classList.contains('done'), 'board solved via hints');
    ok(D.querySelector('#win').open, 'win dialog opens');
    ok(/Streak/.test(D.querySelector('#win-stats').textContent), 'streak stat shown: ' + D.querySelector('#win-stats').textContent);
    const saved = JSON.parse(W.localStorage.getItem('boxerdoku:v1'));
    ok(saved.daily.streak === 1, 'streak saved');
    D.querySelector('#win-next').click(); await wait(100);
    ok(cells().length === 25, 'practice easy 5x5 loaded');
    // mode switch
    D.querySelector('.tab[data-mode="master"]').click(); await wait(100);
    ok(cells().length === 81, 'master 9x9 loaded');
    D.querySelector('.tab[data-mode="daily"]').click(); await wait(100);
    ok(D.querySelector('#board').classList.contains('done'), 'daily stays solved after switching back');
  } catch (e) { out.push('ERROR ' + e.stack); }
  document.getElementById('out').textContent = out.join('\n') + '\nDONE';
};
</script>
